name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Núcleo · dependências
        working-directory: packages/pocketstage_midia_core
        run: dart pub get
      - name: Núcleo · análise
        working-directory: packages/pocketstage_midia_core
        run: bash ../../tool/ci_run.sh "core analyze" dart analyze
      - name: Núcleo · testes das regras
        working-directory: packages/pocketstage_midia_core
        run: bash ../../tool/ci_run.sh "core test" dart test --reporter expanded
      - name: App · dependências
        run: bash tool/ci_run.sh "pub get" flutter pub get
      - name: App · análise
        run: bash tool/ci_run.sh "analyze" flutter analyze --no-fatal-infos
      - name: App · testes
        run: bash tool/ci_run.sh "test" flutter test

  android:
    needs: checar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh "setup" bash tool/setup_platforms.sh
      - run: bash tool/ci_run.sh "build" flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk PocketStage-Midia.apk
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-Android
          path: PocketStage-Midia.apk

  windows:
    needs: checar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh "setup" bash tool/setup_platforms.sh
        shell: bash
      - run: bash tool/ci_run.sh "build" flutter build windows --release
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-Windows
          path: build/windows/x64/runner/Release/

  apple:
    needs: checar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh "setup" bash tool/setup_platforms.sh
      - name: macOS
        run: |
          bash tool/ci_run.sh "build macos" flutter build macos --release
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent *.app ../../../../../PocketStage-Midia-macOS.zip
      - name: iOS (sem assinatura)
        run: |
          bash tool/ci_run.sh "build ios" flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          ditto -c -k --keepParent Runner.app ../../../PocketStage-Midia-iOS-sem-assinatura.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-macOS
          path: PocketStage-Midia-macOS.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-iOS-sem-assinatura
          path: PocketStage-Midia-iOS-sem-assinatura.zip
