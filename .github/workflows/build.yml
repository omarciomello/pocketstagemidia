name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    needs: checar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capturas das telas
        run: CAPTURAS=1 bash tool/ci_run.sh "capturas" flutter test test/capturas_test.dart --update-goldens
      - name: Publicar no ramo ci-capturas
        run: |
          cd test/goldens
          git init -q -b ci-capturas
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add *.png
          git commit -qm "capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-capturas

  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Núcleo · dependências
        working-directory: packages/pocketstage_midia_core
        run: dart pub get
      - name: Núcleo · análise
        working-directory: packages/pocketstage_midia_core
        run: bash ../../tool/ci_run.sh "core analyze" dart analyze
      - name: Núcleo · testes das regras
        working-directory: packages/pocketstage_midia_core
        run: bash ../../tool/ci_run.sh "core test" dart test --reporter expanded
      - name: App · dependências
        run: bash tool/ci_run.sh "pub get" flutter pub get
      - name: App · análise
        run: bash tool/ci_run.sh "analyze" flutter analyze --no-fatal-infos
      - name: App · testes
        run: bash tool/ci_run.sh "test" flutter test

  android:
    needs: checar
    runs-on: ubuntu-latest
    env:
      PSM_KEYSTORE_B64: ${{ secrets.PSM_KEYSTORE_B64 }}
      PSM_KEY_PASSWORD: ${{ secrets.PSM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh "setup" bash tool/setup_platforms.sh
      - run: bash tool/ci_run.sh "build" flutter build apk --release
      - run: bash tool/ci_run.sh "build arm64" flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk PocketStage-Midia.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk PocketStage-Midia-arm64.apk
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-Android
          path: PocketStage-Midia*.apk

  windows:
    needs: checar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh "setup" bash tool/setup_platforms.sh
        shell: bash
      - run: bash tool/ci_run.sh "build" flutter build windows --release
      - name: Capturas do Windows (mesa + telão)
        shell: powershell
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force cap | Out-Null
          Start-Transcript -Path cap/transcript.txt
          $env:PSM_AUTOTESTE = "1"
          Remove-Item "$env:TEMP\psm_mesa.log" -ErrorAction SilentlyContinue
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @"
          using System; using System.Drawing; using System.Runtime.InteropServices; using System.Text;
          public class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr p);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint f);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool IsHungAppWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            public static void Clique(IntPtr h, int dx, int dy) { RECT r; GetWindowRect(h, out r); SetCursorPos(r.L + dx, r.T + dy); System.Threading.Thread.Sleep(80); mouse_event(2, 0, 0, 0, UIntPtr.Zero); System.Threading.Thread.Sleep(60); mouse_event(4, 0, 0, 0, UIntPtr.Zero); }
            public struct RECT { public int L, T, R, B; }
            public static string Lista(uint pid) {
              var sb = new StringBuilder();
              EnumWindows((h, p) => { uint q; GetWindowThreadProcessId(h, out q); if (q == pid && IsWindowVisible(h)) { var t = new StringBuilder(256); GetWindowText(h, t, 256); RECT r; GetWindowRect(h, out r); sb.Append("[" + t + " " + (r.R-r.L) + "x" + (r.B-r.T) + (IsHungAppWindow(h) ? " TRAVADA" : "") + "] "); } return true; }, IntPtr.Zero);
              return sb.ToString();
            }
            public static IntPtr Achar(uint pid, string titulo) {
              IntPtr achou = IntPtr.Zero;
              EnumWindows((h, p) => { uint q; GetWindowThreadProcessId(h, out q); var t = new StringBuilder(256); GetWindowText(h, t, 256); if (q == pid && t.ToString() == titulo) { achou = h; return false; } return true; }, IntPtr.Zero);
              return achou;
            }
            public static void Foto(IntPtr h, string arq) {
              RECT r; GetWindowRect(h, out r); int w = Math.Max(1, r.R - r.L), a = Math.Max(1, r.B - r.T);
              using (var b = new Bitmap(w, a)) { using (var g = Graphics.FromImage(b)) { var dc = g.GetHdc(); PrintWindow(h, dc, 2); g.ReleaseHdc(dc); } b.Save(arq); }
            }
          }
          "@
          $exe = Get-ChildItem build/windows/x64/runner/Release/*.exe | Select-Object -First 1
          Add-Type -AssemblyName System.Windows.Forms
          $docs = [Environment]::GetFolderPath('MyDocuments')
          foreach ($v in "atual") {
            $env:PSM_VARIANTE = $v; $d = $v -replace ":", "_"
            Remove-Item "$docs\PocketStage-Midia-*.txt" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "cap/$d" | Out-Null
            $p = Start-Process $exe.FullName -PassThru
            # 4s: clique no 1º sinal (antes do telão) · 6s: abre o telão · 11s e 15s: cliques · 19s: Parar tudo
            $plano = @{ 4 = @(145, 170); 11 = @(145, 170); 15 = @(145, 265); 19 = @(935, 56) }
            foreach ($s in 3, 4, 8, 11, 12, 15, 19, 21, 24) {
              $falta = $s - ((Get-Date) - $p.StartTime).TotalSeconds
              if ($falta -gt 0) { Start-Sleep -Milliseconds ([int]($falta * 1000)) }
              $m = [Win]::Achar([uint32]$p.Id, "pocketstage_midia")
              # 21s: pede para fechar a mesa (como o X) com o telão aberto; aos 24s deve haver o diálogo
              if ($s -eq 21 -and $m -ne [IntPtr]::Zero) { [Win]::PostMessage($m, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null; "21s WM_CLOSE" | Out-File -Append -Encoding utf8 "cap/$d/estado.txt" }
              if ($plano.ContainsKey($s) -and $m -ne [IntPtr]::Zero) { [Win]::Clique($m, $plano[$s][0], $plano[$s][1]); "${s}s clique" | Out-File -Append -Encoding utf8 "cap/$d/estado.txt"; Start-Sleep -Milliseconds 400 }
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("cap/$d/tela_$s.png")
              "${s}s janelas: $([Win]::Lista([uint32]$p.Id))" | Out-File -Append -Encoding utf8 "cap/$d/estado.txt"
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Copy-Item "$docs\PocketStage-Midia-mesa.txt" "cap/$d/diag-mesa.txt" -ErrorAction SilentlyContinue
            Copy-Item "$docs\PocketStage-Midia-telao.txt" "cap/$d/diag-telao.txt" -ErrorAction SilentlyContinue
          }
      - name: Publicar capturas do Windows
        if: always()
        shell: bash
        run: |
          cd cap
          git init -q -b ci-capturas-win
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "capturas windows ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-capturas-win
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-Windows
          path: build/windows/x64/runner/Release/

  apple:
    needs: checar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh "setup" bash tool/setup_platforms.sh
      - name: macOS
        run: |
          bash tool/ci_run.sh "build macos" flutter build macos --release
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent *.app ../../../../../PocketStage-Midia-macOS.zip
      - name: iOS (sem assinatura)
        run: |
          bash tool/ci_run.sh "build ios" flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          ditto -c -k --keepParent Runner.app ../../../PocketStage-Midia-iOS-sem-assinatura.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-macOS
          path: PocketStage-Midia-macOS.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PocketStage-Midia-iOS-sem-assinatura
          path: PocketStage-Midia-iOS-sem-assinatura.zip

  publicar:
    needs: [android, windows, apple]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Montar arquivos
        run: |
          mkdir -p out
          cp dist/PocketStage-Midia-Android/PocketStage-Midia*.apk out/
          (cd dist/PocketStage-Midia-Windows && zip -qr ../../out/PocketStage-Midia-Windows.zip .)
          cp dist/PocketStage-Midia-macOS/PocketStage-Midia-macOS.zip out/
          ls -la out
      - name: Publicar a versão de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create teste out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Versão de teste (${GITHUB_SHA::7})" \
            --notes "Última versão gerada pelo build. Android: baixe PocketStage-Midia-arm64.apk (mais leve, serve na maioria dos celulares) ou PocketStage-Midia.apk (todos os aparelhos) e instale. Windows: descompacte e abra o .exe. macOS: descompacte e abra o app."
