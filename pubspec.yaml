name: pocketstage_midia
description: PocketStage Mídia — mesa de trilhas, vídeos, imagens e textos para teatro e stand-up.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pocketstage_midia_core:
    path: packages/pocketstage_midia_core
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  path_provider: ^2.1.4
  file_picker: ">=8.1.2 <11.0.0"
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo_400.ttf
          weight: 400
        - asset: assets/fonts/archivo_600.ttf
          weight: 600
        - asset: assets/fonts/archivo_800.ttf
          weight: 800
    - family: ChivoMono
      fonts:
        - asset: assets/fonts/chivo_mono_500.ttf
          weight: 500
        - asset: assets/fonts/chivo_mono_700.ttf
          weight: 700
